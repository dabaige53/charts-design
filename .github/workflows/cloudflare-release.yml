name: Cloudflare release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 vX.Y.Z 标签'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CHARTS_DEPLOY_PROVIDER == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bun -e 'import {validateTag} from "./bin/cloudbase-deploy.mjs"; validateTag(process.env.RELEASE_TAG, (await Bun.file("package.json").json()).version)'
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHARTS_PUBLIC_URL: ${{ vars.CHARTS_PUBLIC_URL }}
          CHARTS_SERVER_TOKENS: ${{ secrets.CHARTS_SERVER_TOKENS }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?}" "${CLOUDFLARE_API_TOKEN:?}" "${CHARTS_SERVER_TOKENS:?}" "${CHARTS_PUBLIC_URL:?}"
          umask 077
          secret_file=$(mktemp "$RUNNER_TEMP/charts.XXXXXX.json")
          trap 'rm -f "$secret_file"' EXIT
          bun -e 'await Bun.write(process.argv[1], JSON.stringify({CHARTS_SERVER_TOKENS: process.env.CHARTS_SERVER_TOKENS}))' "$secret_file"
          bun run deploy:cloudflare --secrets-file "$secret_file" --var "CHARTS_PUBLIC_URL:$CHARTS_PUBLIC_URL" --var "CHARTS_RELEASE_COMMIT:$(git rev-parse HEAD)" --var "CHARTS_RELEASE_VERSION:$(bun -p "require('./package.json').version")"
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 60 "$CHARTS_PUBLIC_URL/health" | jq -e --arg commit "$(git rev-parse HEAD)" '.ok and .release.commit == $commit'; then exit 0; fi
            sleep 5
          done
          exit 1
