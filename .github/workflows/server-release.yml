name: Server and Pages release
on:
  push:
    tags: ['server-v*.*.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify server release version
        run: test "$GITHUB_REF_NAME" = "server-v$(bun -p "require('./package.json').version")"
      - run: bun install --frozen-lockfile --production --ignore-scripts
      - run: bun test ./tests/deploy/pages.test.mjs
      - name: Package the author server and optional Pages share proxy
        run: |
          mkdir release
          bun deploy/pages/build.mjs "$RUNNER_TEMP/pages"
          (cd "$RUNNER_TEMP/pages" && zip -qr "$GITHUB_WORKSPACE/release/pages.zip" .)
          docker build -f deploy/Dockerfile -t "charts-design-api:$GITHUB_REF_NAME" .
          python3 tests/deploy/container_smoke.py --image "charts-design-api:$GITHUB_REF_NAME"
          docker save "charts-design-api:$GITHUB_REF_NAME" | gzip -1 > release/server-image.tar.gz
          cp deploy/mcp.example.json release/
          (cd release && sha256sum pages.zip server-image.tar.gz mcp.example.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: server-release
          path: release/
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-release
          path: release
      - name: Publish server channel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Charts Design $GITHUB_REF_NAME" --notes "SQLite 作者服务器镜像，附可选 Cloudflare Pages 分享代理和 MCP 客户端配置。"
