name: Native runtime packages
on:
  pull_request:
    paths:
      - 'runtime-core/**'
      - 'bin/install-native.mjs'
      - 'bin/build-native.mjs'
      - 'bin/native-runtime.js'
      - 'package.json'
      - 'tests/development/native-install.test.mjs'
      - '.github/workflows/native-release.yml'
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
          - runner: macos-26
            target: aarch64-apple-darwin
            extension: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            extension: '.exe'
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify the shared product version
        run: |
          bun -e 'import {nativeRelease} from "./bin/install-native.mjs"; const r=nativeRelease(process.cwd()),p=await Bun.file("package.json").json(); if(r.version!==p.version || (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${r.version}`)) throw Error("Release tag, npm and Cargo versions must match");'
      - name: Install pinned Rust target
        if: runner.os != 'Linux'
        working-directory: runtime-core
        run: |
          rustup show
          rustup target add '${{ matrix.target }}'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime-core/target
          key: native-package-${{ matrix.target }}-1.91.1-${{ hashFiles('runtime-core/Cargo.lock') }}
      - name: Build and test Linux at the Debian Bookworm baseline
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm -v "$PWD:/work" -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" -w /work/runtime-core \
            -e CARGO_BUILD_JOBS=2 -e CXXFLAGS=-g0 rust:1.91.1-bookworm \
            bash -c 'cargo test --release --locked --target "${{ matrix.target }}" && cargo build --release --locked --target "${{ matrix.target }}"'
      - name: Build and test macOS or Windows
        if: runner.os != 'Linux'
        working-directory: runtime-core
        run: |
          cargo test --release --locked --target '${{ matrix.target }}'
          cargo build --release --locked --target '${{ matrix.target }}'
      - name: Verify the real installer and binary
        run: |
          bun test ./tests/development/native-install.test.mjs
          mkdir -p release
          cp 'runtime-core/target/${{ matrix.target }}/release/charts-design-core${{ matrix.extension }}' 'release/charts-design-core-${{ matrix.target }}${{ matrix.extension }}'
          bun --eval '
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          import {nativeRelease, installNative} from "./bin/install-native.mjs";
          const root=process.cwd(), release=nativeRelease(root), bytes=readFileSync(`release/${release.asset}`);
          const hash=createHash("sha256").update(bytes).digest("hex");
          const receipt=await installNative({root, fetcher: async url => new Response(url.endsWith("/SHA256SUMS") ? `${hash}  ${release.asset}\n` : bytes)});
          if(receipt.target !== "${{ matrix.target }}") throw Error("Installer selected the wrong target");
          console.log(JSON.stringify(receipt));'
      - uses: actions/upload-artifact@v5
        with:
          name: native-release-${{ matrix.target }}
          path: release/charts-design-core-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable native binaries
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: native-release-*
          merge-multiple: true
          path: release
      - name: Publish the complete native target set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find release -maxdepth 1 -type f -name 'charts-design-core-*' | wc -l)" -eq 5
          (cd release && sha256sum charts-design-core-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Charts Design $GITHUB_REF_NAME" --notes "Rust Runtime，包含 CLI、MCP、HTTP、数据、版本、导出和分享能力。原生程序与 npm 包使用同一版本；此工作流不部署云服务。"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
