name: CloudBase release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的正式版本标签，例如 v1.2.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate release tag and scripts
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e 'import {validateTag} from "./bin/cloudbase-deploy.mjs"; import fs from "node:fs"; validateTag(process.env.RELEASE_TAG, JSON.parse(fs.readFileSync("package.json")).version)'
          node --test tests/deploy/cloudbase-release.test.mjs
      - name: Install pinned CloudBase CLI
        run: npm install --global @cloudbase/cli@3.9.1
      - name: Build and deploy on CloudBase
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_SERVICE: ${{ vars.CLOUDBASE_SERVICE }}
          CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION }}
          CLOUDBASE_SERVICE_URL: ${{ vars.CLOUDBASE_SERVICE_URL }}
        run: node bin/cloudbase-deploy.mjs "$RELEASE_TAG"
