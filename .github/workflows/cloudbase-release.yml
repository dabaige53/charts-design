name: CloudBase release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版本标签；仅检查时可填分支名'
        required: true
        type: string
      verify_only:
        description: '只运行定向检查，不迁移或部署'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

jobs:
  verify:
    name: Release scoped checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: annotation-ci
          POSTGRES_DB: annotation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
      - run: uv sync --locked --extra test --extra mcp --extra cloud --group dev --python 3.11
      - run: bun install --frozen-lockfile
        working-directory: runtime-ui
      - name: Validate changed UI and build release resources
        working-directory: runtime-ui
        run: |
          bun run typecheck
          for file in position-comments cos-client web-access-flow version-center; do
            path="./src/$file.test.tsx"
            if [ "$file" = cos-client ]; then path="./src/$file.test.ts"; fi
            bun test "$path" || exit $?
          done
          bun run build
      - run: bun run ui:package
      - name: Verify loading, comments, shares and migration transactions
        env:
          CHARTS_TEST_POSTGRES_URL: postgresql://postgres:annotation-ci@localhost:5432/annotation_test
        run: |
          uv run ruff check dashboard_runtime/annotations.py dashboard_runtime/project.py dashboard_runtime/cloud_project.py dashboard_runtime/cloud_database.py dashboard_runtime/cloud_shares.py dashboard_runtime/cos_view.py dashboard_runtime/server.py dashboard_runtime/service.py dashboard_runtime/tool_contract.py tests/runtime/test_annotation_commands.py tests/runtime/test_annotation_postgres.py tests/runtime/test_cloud_shares.py tests/runtime/test_server.py
          uv run python -m pytest tests/runtime/test_annotation_commands.py tests/runtime/test_annotation_postgres.py tests/runtime/test_cos_view.py tests/runtime/test_cloud_shares.py tests/runtime/test_server.py::test_annotation_command_checks_link_scope_and_revocation tests/runtime/test_server.py::test_preloaded_preview_reuses_authorization_and_includes_options_and_catalog tests/runtime/test_server.py::test_browser_file_batch_keeps_authorization_and_reuses_version_and_object_reads tests/runtime/test_project.py::test_annotation_replacement_requires_the_read_list -q
          bun test ./tests/runtime/static-query.test.mjs ./tests/runtime/static-resources.test.mjs ./tests/runtime/static-client.test.mjs ./tests/deploy
          bun bin/check-doc-links.js
  deploy:
    needs: verify
    if: github.event.inputs.verify_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Validate release tag and scripts
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bun -e 'import {validateTag} from "./bin/cloudbase-deploy.mjs"; import fs from "node:fs"; validateTag(process.env.RELEASE_TAG, JSON.parse(fs.readFileSync("package.json")).version)'
          bun test ./tests/deploy
      - name: Install locked CloudBase CLI
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and deploy on CloudBase
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          CLOUDBASE_ENV_ID: ${{ vars.CLOUDBASE_ENV_ID }}
          CLOUDBASE_SERVICE: ${{ vars.CLOUDBASE_SERVICE }}
          CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION }}
          CLOUDBASE_SERVICE_URL: ${{ vars.CLOUDBASE_SERVICE_URL }}
        run: bun bin/cloudbase-deploy.mjs "$RELEASE_TAG"
