name: Dashboard runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: dashboard-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
  FORCE_COLOR: '1'

# Documentation checks always run. Executable changes share one UI artifact.
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo 'tests=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE" HEAD | bun bin/ci-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
          enable-cache: true
      - run: uv sync --locked --only-group dev --no-install-project --python 3.11
      - name: Lint Python (pyflakes rules)
        run: bun bin/python-runtime.js -m ruff check --output-format=github
      - name: Syntax, skill links and documentation links/anchors
        run: bun run check
      - name: Development workflow checks
        run: bun test ./tests/development ./tests/deploy

  ui:
    name: Shared UI build
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.8-${{ hashFiles('runtime-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.8-
      - run: bun run ui:install
      - run: bun run ui:typecheck
      - run: bun run ui:build
      - uses: actions/upload-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
          if-no-files-found: error
          retention-days: 14
      - name: React component and interaction tests
        working-directory: runtime-ui
        run: |
          mkdir -p reports
          bun test ./src --reporter=junit --reporter-outfile=reports/components.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: component-reports
          path: runtime-ui/reports/
          retention-days: 14

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    needs: [changes, ui]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Compatibility floor, production baseline, and the existing upper CI target.
        python: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --locked --all-extras --no-install-project --python ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
      - name: Package shared UI for backend protocol checks
        run: bun runtime-ui/scripts/package.mjs
      - name: Runtime, MCP protocol and server tests (no browser)
        run: >-
          bun bin/python-runtime.js -m pytest tests/runtime -q
          --junitxml=reports/runtime-unit.xml
          --cov=dashboard_runtime --cov-report=xml:reports/coverage.xml
          --cov-report=term:skip-covered --cov-fail-under=84
      - name: Shared data modules (Bun)
        run: bun test ./tests/runtime
      - name: Workspace and data contracts
        run: bun bin/python-runtime.js -m pytest tests --ignore=tests/runtime -q --junitxml=reports/workspace.xml
      - name: Coverage summary
        if: always()
        run: |
          bun bin/python-runtime.js - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('reports/coverage.xml')
          if path.exists():
              root = ET.parse(path).getroot()
              print(f"### dashboard_runtime coverage (Python ${{ matrix.python }}): {float(root.get('line-rate')) * 100:.1f}%")
              rows = sorted(((float(c.get('line-rate')), c.get('filename')) for c in root.iter('class')))[:8]
              print('| Lowest covered module | Lines |\n| --- | --- |')
              for rate, name in rows:
                  print(f'| {name} | {rate * 100:.0f}% |')
          EOF
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-reports-py${{ matrix.python }}
          path: reports/
          retention-days: 14

  container:
    name: Container image smoke test
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
      - name: Add fake environment files to detect image leaks
        run: |
          uv run --no-project --python 3.11 python - <<'EOF'
          from pathlib import Path
          for name in ('deploy/charts.env', '.env', 'dashboard_runtime/.env'):
              Path(name).write_text('CHARTS_SERVER_TOKENS=build-context-canary-not-a-real-token\n')
          EOF
      - name: Build the deployable image
        run: docker build -f deploy/Dockerfile -t charts-design:ci .
      - name: Run the image and exercise remote MCP and JSON downloads
        run: uv run --no-project --python 3.11 python tests/deploy/container_smoke.py --image charts-design:ci
