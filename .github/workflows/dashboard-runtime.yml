name: Dashboard runtime
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'dashboard_runtime/**'
      - 'runtime-ui/**'
      - 'tests/**'
      - 'skills/executive-charts/scripts/**'
      - 'bin/**'
      - 'package.json'
      - 'pyproject.toml'
      - '.github/workflows/dashboard-runtime.yml'
concurrency:
  group: dashboard-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install explicit runtime test dependencies
        run: |
          python -m pip install '.[statistics,mcp,test]'
          npm --prefix runtime-ui ci
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Audit production browser dependencies
        run: npm --prefix runtime-ui audit --omit=dev --audit-level=moderate
      - name: Build the shared browser and MCP App bundle
        run: npm --prefix runtime-ui run build
      - name: Check shared source syntax
        run: npm run check
      - name: Runtime, MCP protocol and browser tests
        run: |
          set -o pipefail
          python -m pytest tests/runtime -q
          node --test tests/runtime/*.test.mjs
      - name: Standalone chart and dashboard tests
        run: node bin/python-runtime.js -m pytest tests --ignore=tests/runtime -q
