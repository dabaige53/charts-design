name: Dashboard runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_only:
        description: Only build artifacts and run million-row acceptance
        type: boolean
        default: false
concurrency:
  group: dashboard-runtime-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  FORCE_COLOR: '1'
  CARGO_BUILD_JOBS: '2'
  CXXFLAGS: '-g0'

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo 'tests=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE" HEAD | node bin/ci-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  environment:
    name: Prepare reusable CI environment
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
        with:
          rust: ${{ needs.changes.outputs.tests }}
          ui: ${{ needs.changes.outputs.tests }}

  checks:
    name: Static checks
    needs: environment
    if: ${{ !inputs.acceptance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
      - name: Syntax, skill links and documentation links
        run: bun run check
      - name: Development and deployment contracts
        run: bun test ./tests/development ./tests/deploy

  ui:
    name: Build shared UI once
    needs: [changes, environment]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
        with:
          ui: 'true'
      - run: bun run ui:typecheck
        if: ${{ !inputs.acceptance_only }}
      - run: bun run ui:build
      - name: Verify the single distributable UI
        run: bun run ui:package
      - uses: actions/upload-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build Rust runtime and shared UI
    needs: [changes, environment, ui]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHARTS_TEST_DATABASE_URL: postgresql://postgres:charts-ci-password@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: charts-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
        with:
          rust: 'true'
          ui: 'true'
      - uses: actions/download-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-core
          shared-key: native-runtime
          cache-bin: false
          cache-on-failure: true
      - name: Formatting, native behavior and Clippy
        working-directory: runtime-core
        if: ${{ !inputs.acceptance_only }}
        run: |
          cargo fmt --check
          cargo test --release --locked
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Build the native runtime
        working-directory: runtime-core
        run: cargo build --release --locked --bin charts-design-core
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ github.sha }}
          path: runtime-core/target/release/charts-design-core
          if-no-files-found: error
          retention-days: 14
      - name: React component and interaction tests
        if: ${{ !inputs.acceptance_only }}
        working-directory: runtime-ui
        env:
          CHARTS_CORE_BIN: ${{ github.workspace }}/runtime-core/target/release/charts-design-core
        run: |
          mkdir -p reports
          bun test ./src --reporter=junit --reporter-outfile=reports/components.xml
      - name: Native and browser calculation parity
        if: ${{ !inputs.acceptance_only }}
        env:
          CHARTS_CORE_BIN: ${{ github.workspace }}/runtime-core/target/release/charts-design-core
        run: bun test ./tests/runtime
      - uses: actions/upload-artifact@v5
        if: ${{ always() && !inputs.acceptance_only }}
        with:
          name: component-reports
          path: runtime-ui/reports/
          retention-days: 14

  coverage:
    name: Rust coverage gate (84%)
    needs: [changes, environment, ui]
    if: ${{ needs.changes.outputs.tests == 'true' && !inputs.acceptance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHARTS_TEST_DATABASE_URL: postgresql://postgres:charts-ci-password@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: charts-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
        with:
          rust: 'true'
      - uses: actions/download-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-core
          shared-key: native-coverage
          cache-bin: false
          cache-on-failure: true
      - name: Measure the actual native implementation
        working-directory: runtime-core
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'none'
        shell: bash
        run: |
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/charts-coverage-env.sh"
          source "$RUNNER_TEMP/charts-coverage-env.sh"
          cargo llvm-cov clean --workspace
          cargo test --release --locked
          CHARTS_CORE_BIN=$(cargo build --release --locked --bin charts-design-core --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .target.name == "charts-design-core") | .executable // empty')
          export CHARTS_CORE_BIN
          (
            cd ..
            bun test tests/integration/private-sharing.test.mjs
            bun run test:function --ci-server --samples 1 --output "$RUNNER_TEMP/charts-coverage-functional"
          )
          mkdir -p ../reports
          cargo llvm-cov report --release --summary-only | tee ../reports/coverage-summary.txt
          cargo llvm-cov report --release --lcov --output-path ../reports/coverage.lcov --fail-under-lines 84
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-coverage
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container image smoke test
    needs: [changes, environment]
    if: ${{ needs.changes.outputs.tests == 'true' && !inputs.acceptance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
      - name: Add fake environment files to detect image leaks
        run: |
          bun -e 'for (const path of ["deploy/charts.env", ".env", "runtime-core/.env"]) await Bun.write(path, "CHARTS_SERVER_TOKENS=build-context-canary-not-a-real-token\n")'
      - uses: docker/setup-buildx-action@v4
      - name: Build the deployable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: CHARTS_IMAGE_COMMIT=${{ github.sha }}
          tags: charts-design:ci
          load: true
          cache-from: type=gha,scope=charts-ci-image
          cache-to: type=gha,scope=charts-ci-image,mode=max
      - name: MCP, scoped access, Parquet downloads and non-root isolation
        run: bun tests/deploy/container-smoke.mjs --image charts-design:ci --commit "$GITHUB_SHA"

  acceptance:
    name: Dashboard and static-share acceptance
    needs: [changes, environment, ui, build]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHARTS_CORE_BIN: ${{ github.workspace }}/runtime-core/native/charts-design-core
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-environment
      - uses: actions/download-artifact@v5
        with:
          name: native-${{ github.sha }}
          path: runtime-core/native/
      - run: chmod +x runtime-core/native/charts-design-core
      - uses: actions/download-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
      - run: bun run ui:package
      - name: Fixed private share lifecycle without external services
        if: ${{ !inputs.acceptance_only }}
        run: bun test tests/integration/private-sharing.test.mjs
      - name: Native stdio MCP, saved previews, annotations and the real share Worker
        if: ${{ !inputs.acceptance_only }}
        run: bun run test:function --ci-server --samples 3 --output "$RUNNER_TEMP/charts-functional"
      - name: Record first-view and data-preview timings
        env:
          EVENT: ${{ github.event_name }}
        run: |
          rows=100000
          if [ "$EVENT" != pull_request ]; then rows=1000000; fi
          bun run test:performance --rows "$rows" --ci-server --samples 3 --output "$RUNNER_TEMP/charts-performance"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dashboard-acceptance
          path: |
            ${{ runner.temp }}/charts-functional/report.json
            ${{ runner.temp }}/charts-performance/report.json
          if-no-files-found: warn
          retention-days: 14
