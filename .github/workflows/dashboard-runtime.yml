name: Dashboard runtime
on:
  push:
    branches: [feat/dashboard-runtime-mcp-cli]
  pull_request:
    paths:
      - 'dashboard_runtime/**'
      - 'runtime-ui/**'
      - 'tests/runtime/**'
      - 'pyproject.toml'
      - '.github/workflows/dashboard-runtime.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install explicit runtime test dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'mcp>=1.28,<2' playwright
          npm --prefix runtime-ui install
          python -m playwright install --with-deps chromium
      - name: Audit production browser dependencies
        run: npm --prefix runtime-ui audit --omit=dev --audit-level=moderate --json > runtime-audit.json
      - name: Build the shared browser and MCP App bundle
        run: npm --prefix runtime-ui run build
      - name: Core, MCP protocol, legacy adapter and real browser acceptance
        run: |
          set -o pipefail
          python -m pytest tests/runtime -q | tee runtime-tests.txt
          node --test tests/runtime/engine.test.mjs
      - name: Package source and built UI for review
        if: always()
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=__pycache__ --exclude=.pytest_cache -czf /tmp/runtime-source.tar.gz .
          mv /tmp/runtime-source.tar.gz runtime-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-runtime-review
          path: |
            runtime-source.tar.gz
            runtime-tests.txt
            runtime-audit.json
            runtime-screenshot.png
            runtime-ui/package-lock.json
            dashboard_runtime/web/dist/
          retention-days: 7
