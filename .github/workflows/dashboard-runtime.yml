name: Dashboard runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance_only:
        description: Only build artifacts and run million-row acceptance
        type: boolean
        default: false
concurrency:
  group: dashboard-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FORCE_COLOR: '1'
  CARGO_BUILD_JOBS: '2'
  CXXFLAGS: '-g0'

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo 'tests=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE" HEAD | bun bin/ci-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Static checks
    if: ${{ !inputs.acceptance_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --production --ignore-scripts
      - name: Syntax, skill links and documentation links
        run: bun run check
      - name: Development and deployment contracts
        run: bun test ./tests/development ./tests/deploy

  native:
    name: Rust runtime
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: runtime-core
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        if: ${{ !inputs.acceptance_only }}
        with:
          bun-version-file: .bun-version
      - name: Prepare UI for native preview tests
        if: ${{ !inputs.acceptance_only }}
        working-directory: .
        run: |
          bun run ui:install
          bun run ui:prepare
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-core
          shared-key: native-runtime
      - name: Formatting, native behavior and Clippy
        if: ${{ !inputs.acceptance_only }}
        run: |
          cargo fmt --check
          cargo test --release --locked
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Build the native runtime
        run: cargo build --release --locked --bin charts-design-core
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ github.sha }}
          path: runtime-core/target/release/charts-design-core
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Rust coverage gate (84%)
    needs: changes
    if: ${{ needs.changes.outputs.tests == 'true' && !inputs.acceptance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Prepare UI for native preview tests
        run: |
          bun run ui:install
          bun run ui:prepare
      - name: Install the pinned compiler and coverage tools
        working-directory: runtime-core
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-core
          shared-key: native-coverage
      - name: Measure the actual native implementation
        working-directory: runtime-core
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'none'
        run: |
          mkdir -p ../reports
          cargo llvm-cov --release --locked --lcov --output-path ../reports/coverage.lcov --fail-under-lines 84
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-coverage
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: Shared UI and browser data contracts
    needs: [changes, native]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHARTS_CORE_BIN: ${{ github.workspace }}/runtime-core/native/charts-design-core
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v5
        with:
          name: native-${{ github.sha }}
          path: runtime-core/native/
      - run: chmod +x runtime-core/native/charts-design-core
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.8-${{ hashFiles('runtime-ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.8-
      - run: bun run ui:install
      - run: bun run ui:typecheck
        if: ${{ !inputs.acceptance_only }}
      - run: bun run ui:build
      - name: Verify the single distributable UI
        run: bun run ui:package
      - uses: actions/upload-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
          if-no-files-found: error
          retention-days: 14
      - name: React component and interaction tests
        if: ${{ !inputs.acceptance_only }}
        working-directory: runtime-ui
        run: |
          mkdir -p reports
          bun test ./src --reporter=junit --reporter-outfile=reports/components.xml
      - name: Native and browser calculation parity
        if: ${{ !inputs.acceptance_only }}
        run: bun test ./tests/runtime
      - uses: actions/upload-artifact@v5
        if: ${{ always() && !inputs.acceptance_only }}
        with:
          name: component-reports
          path: runtime-ui/reports/
          retention-days: 14

  container:
    name: Container image smoke test
    needs: changes
    if: ${{ needs.changes.outputs.tests == 'true' && !inputs.acceptance_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Add fake environment files to detect image leaks
        run: |
          bun -e 'for (const path of ["deploy/charts.env", ".env", "runtime-core/.env"]) await Bun.write(path, "CHARTS_SERVER_TOKENS=build-context-canary-not-a-real-token\n")'
      - name: Build the deployable image
        run: docker build -f deploy/Dockerfile -t charts-design:ci .
      - name: MCP, scoped access, Parquet downloads and non-root isolation
        run: bun tests/deploy/container-smoke.mjs --image charts-design:ci

  acceptance:
    name: Dashboard and static-share acceptance
    needs: [changes, ui, native]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHARTS_CORE_BIN: ${{ github.workspace }}/runtime-core/native/charts-design-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v5
        with:
          name: native-${{ github.sha }}
          path: runtime-core/native/
      - run: chmod +x runtime-core/native/charts-design-core
      - uses: actions/download-artifact@v5
        with:
          name: shared-ui-${{ github.sha }}
          path: runtime-ui/dist/
      - run: bun run ui:package
      - name: Fixed private share lifecycle without external services
        if: ${{ !inputs.acceptance_only }}
        run: bun test tests/integration/private-sharing.test.mjs
      - name: Native stdio MCP, saved previews, annotations and the real share Worker
        if: ${{ !inputs.acceptance_only }}
        run: bun run test:function --ci-server --samples 3 --output "$RUNNER_TEMP/charts-functional"
      - name: Record first-view and data-preview timings
        env:
          EVENT: ${{ github.event_name }}
        run: |
          rows=100000
          if [ "$EVENT" != pull_request ]; then rows=1000000; fi
          bun run test:performance --rows "$rows" --ci-server --samples 3 --output "$RUNNER_TEMP/charts-performance"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dashboard-acceptance
          path: |
            ${{ runner.temp }}/charts-functional/report.json
            ${{ runner.temp }}/charts-performance/report.json
          if-no-files-found: warn
          retention-days: 14
