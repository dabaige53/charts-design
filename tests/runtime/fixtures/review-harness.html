<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review UI integration fixture</title>
<link rel="stylesheet" href="../../../dashboard_runtime/web/reviews.css">
<style>
:root{--canvas:#f5f7f9;--surface:white;--text:#17212b;--muted:#667482;--line:#dbe2e8;--accent:#123b5d;font:14px/1.6 system-ui}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text)}button,textarea,select{font:inherit;color:inherit}button,select,textarea{background:white;border:1px solid var(--line);border-radius:7px;padding:8px}button{cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:2px solid var(--accent)}textarea{width:100%;display:block}button[hidden]{display:none}
.workspace{padding:24px;max-width:1800px;margin:0 auto}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}.fixture-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}[data-component-id]{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0;min-height:220px}.value{font-size:36px;letter-spacing:-1px}h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 14px}.muted{color:var(--muted);font-size:12px}
.annotation-layer{position:fixed;inset:0;z-index:1000;pointer-events:none;color:var(--text)}.annotation-layer[hidden],.annotation-panel[hidden],.annotation-outline[hidden],.annotation-hint[hidden]{display:none}
.annotation-panel{position:fixed;overflow:auto;padding:16px;background:var(--surface);border:1px solid var(--line);pointer-events:auto;box-shadow:0 8px 32px #0002}.annotation-panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.annotation-panel p{overflow-wrap:anywhere;white-space:pre-wrap}.annotation-panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.annotation-panel-list{display:grid;gap:8px}.annotation-list-entry{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}.annotation-list-entry span{display:block}.annotation-error{color:#a4453c}.annotation-error:empty{display:none}.annotation-pin{position:fixed;transform:translate(-50%,-50%);width:28px;height:28px;padding:0;border:2px solid white;border-radius:50%;background:var(--accent);color:white;pointer-events:auto}.annotation-outline{position:fixed;border:2px solid var(--accent);pointer-events:none}.annotation-hint{position:fixed;bottom:18px;transform:translateX(-50%);padding:8px 16px;border-radius:20px;background:var(--accent);color:white;text-align:center}.is-annotating{cursor:crosshair;user-select:none}
@media(max-width:650px){.workspace{padding:16px}.fixture-cards{grid-template-columns:1fr}}
</style>
<main class="workspace"><header class="toolbar"><h1>Revenue review</h1><button class="annotation-toggle">Review</button></header><p class="muted">Synthetic fixture. Real annotation modules; stubbed persistence and ECharts geometry.</p><section class="fixture-cards"><article data-component-id="revenue"><h2 id="revenue-title">Operating revenue</h2><div class="value">128.6 million</div><p>YoY +12.4% &middot; MoM +3.2%</p></article><article data-component-id="yield"><h2>Average fare</h2><div class="value">628</div><p>Compare the same period and traffic scope.</p></article><article data-component-id="trend"><h2>Monthly trend</h2><div class="chart" style="height:160px;border-bottom:2px solid #123b5d"></div></article><article data-component-id="load"><h2>Load factor</h2><div class="value">86.8%</div></article></section></main>
<script type="module">
import {createAnnotations} from '../../../dashboard_runtime/web/annotations.mjs';
import {configureAnnotationCharts} from '../../../dashboard_runtime/web/annotation-points.mjs';
const params=new URLSearchParams(location.search),root=document.querySelector('.workspace');
const base={id:'board-a',revision:0,manifest:{components:{revenue:{kind:'kpi',title:'Operating revenue'},yield:{kind:'kpi',title:'Average fare'},trend:{kind:'chart',title:'Trend'},load:{kind:'kpi',title:'Load factor'}},filters:[],annotations:[]}};
let doc=JSON.parse(localStorage.getItem('review-fixture')||'null')||structuredClone(base);
const target=root.querySelector('[data-component-id=trend] .chart');
if(params.has('shadow')){const card=document.createElement('section');card.className='original-host';const parent=target.parentNode;target.id='original-trend';card.attachShadow({mode:'open'}).append(target);parent.append(card);}
const option={xAxis:[{type:'category',data:['Jan','Feb']}],yAxis:[{type:'value'}],series:[{name:'Revenue',type:'line',data:[10,20]}]};
const chart={getOption:()=>option,getDom:()=>target,getWidth:()=>target.clientWidth,getHeight:()=>target.clientHeight,isDisposed:()=>false,containPixel:()=>true,convertToPixel:(_,xy)=>[30+xy[0]*50,100-xy[1]*2]};
configureAnnotationCharts({getInstanceByDom:node=>node===target?chart:null});
const errors=[],attached=[];let fail=false,saves=0;
const manager=createAnnotations({root,getDocument:()=>doc,readOnly:params.has('readonly'),onError:e=>errors.push(e.message),onMode:active=>root.querySelector('.annotation-toggle').setAttribute('aria-pressed',String(active)),attachContext:params.has('host')?async n=>{if(fail)throw Error('Attach failed');attached.push(n);}:null,save:async transform=>{await new Promise(r=>setTimeout(r,5));if(fail)throw Error('Simulated save failure');const next=transform(doc.manifest.annotations);doc={...doc,revision:doc.revision+1,manifest:{...doc.manifest,annotations:next}};saves++;localStorage.setItem('review-fixture',JSON.stringify(doc));manager.refresh();}});
root.querySelector('button').onclick=()=>manager.toggle();manager.refresh();
window.fixture={get doc(){return doc},get errors(){return errors},get saves(){return saves},get attached(){return attached},manager,setFail:value=>fail=value,setDoc:value=>{doc=value;manager.refresh()},reset:()=>{localStorage.clear();doc=structuredClone(base);manager.reset();manager.refresh()},add:notes=>{doc.manifest.annotations.push(...notes);manager.refresh()},option,chart};
window.ready=true;
</script></html>
