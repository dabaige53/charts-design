<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访问分享 · Charts Design</title>{{favicon}}<style nonce="{{nonce}}">
:root{color-scheme:light;--canvas:#f5f5f4;--surface:#fff;--ink:#1c1917;--muted:#57534e;--border:#d6d3d1;--primary:#123b5d;--focus:#2c6485;--error:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.6 'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}::selection{background:var(--primary);color:#fff}main{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px}.access{width:100%;max-width:420px;padding:36px;background:var(--surface);border:1px solid var(--border);border-radius:8px}h1{font-size:20px;line-height:1.4;font-weight:600;margin:0 0 8px;text-wrap:balance}.intro{margin:0 0 28px;color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;height:48px;padding:10px 14px;border:1px solid var(--border);border-radius:0;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.2em;caret-color:var(--primary)}input:hover{border-color:var(--muted)}input[aria-invalid=true]{border-color:var(--error)}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.hint{margin:8px 0 24px;color:var(--muted);font-size:12px}.error{margin:0 0 20px;padding:12px;background:var(--canvas);color:var(--error);overflow-wrap:anywhere}button{width:100%;min-height:44px;padding:10px 16px;border:0;border-radius:0;background:var(--primary);color:#fff;font:inherit;font-weight:600;cursor:pointer}button:hover{background:var(--focus)}button:active{background:#051c2c}.footer{margin:24px 0 0;color:var(--muted);font-size:12px;text-align:center}.retry{display:block;margin:16px 0 0;text-align:center;color:var(--primary);text-underline-offset:3px}@media(max-width:480px){main{padding:20px 16px}.access{padding:28px 24px}}
</style></head><body><main><section class="access" aria-labelledby="access-title"><h1 id="access-title">访问分享</h1><p class="intro">输入分享者提供的密钥，即可查看页面。</p>{{error}}<form method="post" action="{{path}}"><label for="access-key">8 位数字访问密钥</label><input id="access-key" name="accessKey" type="password" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" required autocomplete="off" aria-describedby="{{description}}"{{invalid}}><p class="hint" id="key-hint" aria-live="polite">可直接粘贴密钥，包含开头的 0。</p><button type="submit">打开分享</button></form>{{retry}}<p class="footer">Charts Design · 私密分享</p></section></main><script nonce="{{nonce}}">
const parameters=new URLSearchParams(location.hash.slice(1));const feedback=parameters.get('feedback');const key=parameters.get('key');if(feedback){history.replaceState(null,'',location.pathname+location.search);const form=document.querySelector('form');const input=document.createElement('input');input.type='hidden';input.name='feedbackToken';input.value=feedback;form.appendChild(input);document.getElementById('access-key').disabled=true;form.submit();}else if(key!==null){history.replaceState(null,'',location.pathname+location.search);if(/^[0-9]{8}$/.test(key)){document.getElementById('access-key').value=key;document.getElementById('key-hint').textContent='密钥已从分享链接填入，点击下方按钮即可查看。';}}
</script></body></html>
