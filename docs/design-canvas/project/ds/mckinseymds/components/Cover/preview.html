<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;width:960px;height:320px;background:var(--color-white);color:var(--color-brand-deep-blue)}.cover{position:relative;width:960px;height:320px;overflow:hidden}.ground{fill:var(--color-white)}.deep{fill:var(--color-brand-deep-blue)}.electric{fill:var(--color-brand-electric-blue)}.cyan{fill:var(--color-brand-cyan)}.pale{fill:var(--color-data-pale-blue)}.rule{stroke:var(--color-white);stroke-width:var(--border-width)}h1{position:absolute;left:var(--space-32);bottom:var(--space-64);font-family:var(--font-display);font-weight:700;font-size:64px;line-height:1;margin:0;width:420px}p{position:absolute;left:var(--space-32);bottom:var(--space-32);margin:0;font-family:var(--font-sans);font-size:14px}</style></head><body><div class="cover">
<!-- Blocks: color-brand-deep-blue 480×320; electric-blue 320×160; cyan 160×160; pale-blue 320×160.
Arrangement: modular editorial fields to the right of x=480, all dimensions multiples of space-16.
Pattern: three hairline rules; the source organizes editorial content by borders, order and hierarchy.
Scales: space-16, space-32, space-64 and border-width; source provides no global radius, rectangles remain square. -->
<svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true"><rect class="ground" width="960" height="320"/><rect class="deep" x="480" width="480" height="320"/><rect class="electric" x="640" width="320" height="160"/><rect class="cyan" x="480" y="160" width="160" height="160"/><rect class="pale" x="640" y="160" width="320" height="160"/><path class="rule" d="M512 64H608 M512 96H608 M512 128H608"/></svg><h1>McKinsey<br>MDS</h1><p>秩序、层级与节奏</p></div></body></html>
