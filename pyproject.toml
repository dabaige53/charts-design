[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charts-design-runtime"
version = "0.6.0"
description = "Versioned dashboard data and MCP runtime with shared React UI components"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
statistics = ["seaborn>=0.13.2,<0.14", "matplotlib>=3.8,<4", "pandas>=2.1,<3"]
mcp = ["mcp>=1.28,<2"]
test = ["pytest>=8,<9", "pytest-cov>=5,<8"]

[project.scripts]
charts-design-runtime = "dashboard_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["dashboard_runtime*", "skills"]

[tool.setuptools.package-data]
dashboard_runtime = ["examples/*.md", "web/*.mjs", "web/dist/*"]
skills = ["executive-charts/SKILL.md", "executive-charts/references/*.json", "executive-charts/references/*.md", "executive-charts/scripts/*.py", "executive-charts/scripts/core/*.py", "executive-charts/scripts/README.md", "analytical-reports/SKILL.md", "analytical-reports/references/*.md"]

[tool.pyright]
extraPaths = [".mcp-test-deps", "skills/executive-charts/scripts"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".mcp-test-deps", "examples", "dist", "boards"]

[tool.ruff.lint]
# Pyflakes rules: undefined names, unused imports/variables, broken f-strings.
select = ["F"]
