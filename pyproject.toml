[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charts-design-runtime"
version = "0.6.0"
description = "Versioned ECharts dashboard runtime with CLI, local web editor and MCP Apps"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
statistics = ["seaborn>=0.13.2,<0.14", "matplotlib>=3.8,<4", "pandas>=2.1,<3"]
mcp = ["mcp>=1.28,<2"]
test = ["pytest>=8,<9", "playwright==1.59.0"]

[project.scripts]
charts-design-runtime = "dashboard_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["dashboard_runtime*"]

[tool.setuptools.package-data]
dashboard_runtime = ["examples/*.md", "web/*.mjs", "web/*.css", "web/dist/*.js", "web/dist/*.css"]

[tool.pyright]
extraPaths = [".mcp-test-deps", "skills/executive-charts/scripts"]
