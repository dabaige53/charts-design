# Reverse proxy with TLS in front of the server on 127.0.0.1:8000.
server {
    listen 443 ssl;
    http2 on;
    server_name charts.example.com;
    ssl_certificate     /etc/letsencrypt/live/charts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charts.example.com/privkey.pem;

    client_max_body_size 20m;   # dataset_import and patches accept up to 16 MiB

    # Streamable HTTP MCP: keep SSE responses unbuffered and long-lived.
    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        access_log off;          # /mcp/<token> paths would otherwise be logged
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;          # signed download links
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name charts.example.com;
    return 301 https://$host$request_uri;
}
