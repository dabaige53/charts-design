# docker compose -f deploy/docker-compose.yml up -d --build
# Put the variables in deploy/charts.env (copy environment.example); keep it out of Git.
services:
  charts:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: charts-design:latest
    restart: unless-stopped
    env_file: ${CHARTS_AUTHOR_ENV_FILE:-charts.env}
    ports:
      - "127.0.0.1:${CHARTS_AUTHOR_PORT:-8000}:8000"
    volumes:
      - charts-data:/data
volumes:
  charts-data:
