# docker compose -f deploy/docker-compose.yml up -d --build
# Put the variables in deploy/charts.env (copy environment.example); keep it out of Git.
services:
  charts:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        EXTRAS: ""          # "statistics" adds Seaborn charts
    image: charts-design:latest
    restart: unless-stopped
    env_file: charts.env
    ports:
      - "127.0.0.1:8000:8000"   # publish through the reverse proxy, not directly
    volumes:
      - charts-data:/data
volumes:
  charts-data:
