<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 年各区域营业收入 - 麦肯锡咨询级图表组件</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Apache ECharts 5.5.0 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        }
        body {
            font-family: var(--font-sans);
            background-color: #F8FAFC;
            color: #0F172A;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .chart-standalone-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            box-shadow: 0 4px 20px -2px rgba(18, 59, 93, 0.06);
            width: 100%;
            max-width: 780px;
            padding: 24px;
            position: relative;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .chart-action-btn {
            height: 28px;
            padding: 0 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #64748B;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .chart-action-btn:hover {
            background-color: #F1F5F9;
            color: #123B5D;
            border-color: #CBD5E1;
        }
        .chart-action-btn.icon-only {
            width: 28px;
            padding: 0;
        }

        .chart-explain-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            color: #64748B;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }
        .chart-explain-btn svg { stroke: #64748B; transition: stroke .2s ease; }
        .chart-explain-btn:hover {
            background: #123B5D;
            border-color: #123B5D;
            color: #FFFFFF;
            transform: scale(1.12);
            box-shadow: 0 3px 8px rgba(18, 59, 93, 0.2);
        }
        .chart-explain-btn:hover svg { stroke: #FFFFFF; }
        .chart-explain-btn:active { transform: scale(0.95); }
        dialog.explanation-dialog {
            width: min(720px, calc(100vw - 32px));
            max-width: 720px;
            margin: auto;
            background: #FFFFFF;
            color: #17212B;
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(18, 59, 93, 0.25);
            padding: 0;
            max-height: 85vh;
        }
        dialog.explanation-dialog::backdrop {
            background: rgba(11, 42, 66, 0.45);
            backdrop-filter: blur(4px);
        }
        .exp-dialog-topbar {
            height: 52px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #E2E8F0;
            background: #FFFFFF;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .exp-dialog-body {
            padding: 18px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: calc(85vh - 52px);
            overflow-y: auto;
            background: #FFFFFF;
        }
        .exp-overview-box {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .exp-specs-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #CBD5E1;
        }
        .exp-spec-badge {
            font-size: 11px;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            padding: 2px 8px;
            border-radius: 4px;
            color: #17212B;
        }
        .exp-axis-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .exp-axis-cell {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 11.5px;
        }
        .exp-metric-card {
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 12px;
            background: #FFFFFF;
            transition: border-color .15s;
        }
        .exp-metric-card:hover { border-color: #123B5D; }
        .exp-formula {
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11.5px;
            color: #0F172A;
        }
        @media (max-width: 560px) {
            .exp-axis-grid { grid-template-columns: 1fr; }
        }

        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #0B2A42;
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .toast-popup.show {
            opacity: 1;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="chart-standalone-card" id="cardContainer">
        <!-- Card Header (No Icon, Pure Typography) -->
        <div class="card-header-wrap flex flex-wrap items-start justify-between gap-3 mb-4 pb-3 border-b border-slate-100">
            <div class="min-w-0 max-w-[65%]">
                <h3 class="text-sm font-bold text-[#0B2A42] tracking-tight truncate">2026 年各区域营业收入</h3>
                <p class="text-xs text-[#52606D] mt-0.5 leading-relaxed">按区域比较当期营业收入规模</p>
            </div>

            <!-- Standard 5+1 Interactive Toolbar -->
            <div class="flex items-center gap-1.5 flex-shrink-0">
                <!-- 1. Granularity Toggle -->
                
                <!-- 2. Chart / Table Toggle -->
                <button type="button" class="chart-action-btn" id="viewToggleBtn" onclick="toggleView()" title="一键切换图表/数据透视表视图">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
                </button>
                <!-- 3. Export CSV (with BOM) -->
                <button type="button" class="chart-action-btn icon-only" onclick="exportCSV()" title="一键导出 CSV / Excel (UTF-8 BOM 防乱码)">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                </button>
                <!-- 4. Copy High-Res PNG -->
                <button type="button" class="chart-action-btn icon-only" onclick="copyPNG()" title="复制 2x 高清 PNG 图片 (直接粘贴入 PPT)">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
                <!-- 5. Fullscreen Focus -->
                <button type="button" class="chart-action-btn icon-only" onclick="toggleFullscreen()" title="全屏沉浸研判 (按 Esc 退出)">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
                </button>
                <!-- 6. Explanation Dialog (i) -->
                <button type="button" class="chart-explain-btn" data-explain-chart="C01" onclick="openExplanation()" aria-label="查看业务口径说明" title="查看业务口径与计算公式说明">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </button>
            </div>
        </div>

        <!-- Body: Chart Container & Table Pane -->
        <div class="relative w-full h-[340px]" id="chartBodyContainer">
            <div id="chart-main" class="w-full h-full"></div>
            <div id="table-main" class="hidden w-full h-full overflow-auto custom-scrollbar bg-white rounded border border-slate-100"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-popup">已复制到剪贴板</div>

    <!-- Shared Explanation Dialog -->
    <dialog id="app-explain-dialog" class="explanation-dialog"></dialog>

    <!-- Core Script -->
    <script>
        const TOKENS = {
            palette: {
                primary: '#123B5D',        // 旗舰深海蓝 (主序列/核心强调)
                primaryStrong: '#0B2A42',  // 墨蓝黑 (高对比主标题/关键标签)
                primarySoft: '#DCE8F0',    // 冰川淡蓝 (辅助对比/背景底槽)
                secondary: '#2C6485',      // 钢蓝 (次级对比序列)
                tertiary: '#628EA8',       // 浅灰蓝 (第三对比序列)
                slate: '#8C9DAE',          // 雾板岩灰 (第四对比序列)
                ink: '#0F172A',            // 炭黑正文
                inkMuted: '#52606D',       // 板岩深灰 (副标题/坐标刻度)
                inkSubtle: '#7B8794',      // 板岩淡灰 (注脚/量纲)
                positive: '#2F6B55',       // 咨询墨绿 (正向增长/达标/盈利)
                negative: '#A4453C',       // 咨询绯红 (负向承压/收缩/预警)
                attention: '#9A6A18',      // 咨询琥珀金 (重点关注/待研判)
                canvas: '#FFFFFF',
                surfaceGround: '#F8FAFC',
                gridline: '#E2E8F0',
                rule: '#CBD5E1',
                categorical: ['#123B5D', '#2C6485', '#628EA8', '#8C9DAE', '#9A6A18', '#A4453C', '#2F6B55', '#BDD0DC']
            },
            commonOption: {
                color: ['#123B5D', '#2C6485', '#628EA8', '#8C9DAE', '#9A6A18', '#A4453C', '#2F6B55', '#BDD0DC'],
                animation: true,
                animationDuration: 350,
                grid: { top: 40, bottom: 40, left: 12, right: 24, containLabel: true },
                textStyle: { fontFamily: 'Inter, -apple-system, sans-serif', color: '#0F172A' },
                xAxis: {
                    axisLabel: { color: '#1E293B', fontSize: 11, fontWeight: 600 },
                    axisLine: { lineStyle: { color: '#94A3B8', width: 1.2 } },
                    axisTick: { lineStyle: { color: '#94A3B8' } },
                    splitLine: { lineStyle: { color: '#E2E8F0', type: 'dashed' } }
                },
                yAxis: {
                    axisLabel: { color: '#1E293B', fontSize: 11, fontWeight: 600 },
                    axisLine: { lineStyle: { color: '#94A3B8', width: 1.2 } },
                    axisTick: { lineStyle: { color: '#94A3B8' } },
                    splitLine: { lineStyle: { color: '#E2E8F0', type: 'dashed' } }
                }
            },
            axisTitleStyleY: { color: '#0B2A42', fontSize: 11, fontWeight: 700, align: 'left', padding: [0, 0, 6, 0] },
            axisTitleStyleX: { color: '#0B2A42', fontSize: 11, fontWeight: 700, align: 'center', padding: [8, 0, 0, 0] }
        };

        const chartConfig = { ...({
        id: 'chart-c01',
        code: 'c01',
        title: '全国各大基地枢纽机场营收贡献对比',
        subtitle: '衡量全国五大核心基地枢纽当期客运收入贡献与规模差异',
        explainKey: 'c01',
        data: {
            categories: ['华东基地', '华南基地', '北方基地', '西南基地', '海外基地'],
            values: [4.9, 3.4, 2.8, 1.9, 1.2]
        },
        optionBuilder: (d, gran, tokens, cfg = {}) => {
            const presentation = cfg.presentation || {};
            const axisLabels = presentation.axisLabels || {};
            const seriesLabel = (presentation.seriesLabels || ['数值'])[0];
            const tooltipLabel = (presentation.tooltipValueLabels || [seriesLabel])[0];
            const unit = (presentation.units || [cfg.unit || ''])[0];
            const yDomain = (presentation.domains || {}).y || {};
            return ({
            ...tokens.commonOption,
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(255, 255, 255, 0.98)',
                borderColor: tokens.palette.rule,
                borderWidth: 1,
                padding: [8, 12],
                extraCssText: 'box-shadow: 0 4px 14px rgba(18, 59, 93, 0.08); border-radius: 6px;',
                formatter: params => `<div class="font-bold text-primary-strong mb-1">${params[0].name}</div><div class="flex items-center justify-between gap-4"><span class="text-ink-muted">${tooltipLabel}:</span><span class="font-mono font-bold text-primary">${params[0].value}${unit ? ` ${unit}` : ''}</span></div>`
            },
            xAxis: { type: 'category', name: axisLabels.x || '类别', nameLocation: 'middle', nameGap: 20, nameTextStyle: tokens.axisTitleStyleX, data: d.categories, axisTick: { show: false } },
            yAxis: { type: 'value', ...yDomain, name: axisLabels.y || `${seriesLabel}${unit ? ` (${unit})` : ''}`, nameLocation: 'end', nameTextStyle: tokens.axisTitleStyleY, axisLabel: { formatter: value => `${value}${unit ? ` ${unit}` : ''}` }, splitLine: { lineStyle: { color: tokens.palette.gridline } } },
            series: [{ name: seriesLabel, type: 'bar', barWidth: 26, data: d.values, itemStyle: { color: tokens.palette.primary }, label: { show: true, position: 'top', distance: 6, formatter: params => `${params.value}${unit ? ` ${unit}` : ''}`, color: tokens.palette.ink, fontSize: 11, fontWeight: 'bold' } }]
        });
        },
        tableDataExtractor: (d, gran, cfg = {}) => {
            const presentation = cfg.presentation || {};
            const axisLabels = presentation.axisLabels || {};
            const seriesLabel = (presentation.seriesLabels || ['数值'])[0];
            const unit = (presentation.units || [cfg.unit || ''])[0];
            return {
                headers: presentation.tableHeaders || [axisLabels.x || '类别', `${seriesLabel}${unit ? ` (${unit})` : ''}`],
                rows: d.categories.map((c, i) => [c, `${d.values[i]}${unit ? ` ${unit}` : ''}`])
            };
        }
    }), ...{"id": "regional-sales", "code": "c01", "title": "2026 年各区域营业收入", "subtitle": "按区域比较当期营业收入规模", "unit": "万元", "data": {"categories": ["华东", "华南", "华北", "西南", "东北"], "values": [1280, 1060, 920, 760, 540]}, "presentation": {"axisLabels": {"x": "区域", "y": "营业收入（万元）"}, "seriesLabels": ["营业收入"], "tooltipValueLabels": ["当期营业收入"], "units": ["万元"], "tableHeaders": ["区域", "营业收入（万元）"]}} };
        const explanationData = {"title": "全国各大基地枢纽机场营收贡献对比", "overview": "衡量全国各战略基地枢纽（北京大兴/首都、上海虹桥/浦东、广州白云、成都天府、深圳宝安）当期客货运收入规模差异。", "type": "柱状图", "period": "2025Q1 报告期", "comparison": "基地枢纽横向对标", "structure": {"xAxis": {"name": "基地枢纽", "meaning": "五大核心枢纽机场", "range": "5 个基地"}, "yAxis": {"name": "营收规模 (亿元)", "meaning": "枢纽港客运结算总额", "range": "0 ~ 6.5 亿元"}, "series": [{"name": "基地营收", "desc": "标准垂直柱体"}]}, "metrics": [{"name": "枢纽贡献率", "definition": "单个枢纽机场始发与经停航班创造的客票收入占集团总收入的比重。", "formula": "枢纽营收 ÷ 集团总营收 × 100%", "rule": "主基地营收贡献率通常超过 35.0%。"}]};

        let chartInstance = null;
        let isTableView = false;
        let currentGranularity = 'month';
        let currentSortCol = null;
        let currentSortAsc = true;

        function buildChartOption() {
            return chartConfig.optionBuilder(chartConfig.data, currentGranularity, TOKENS, chartConfig);
        }

        function initChart() {
            const chartDom = document.getElementById('chart-main');
            chartInstance = echarts.init(chartDom);
            chartInstance.setOption(buildChartOption());

            window.addEventListener('resize', () => {
                if (chartInstance) chartInstance.resize();
            });
        }

        function setGranularity(granularity, activeButton) {
            currentGranularity = granularity;
            const tabs = document.getElementById('granularityTabs');
            tabs.querySelectorAll('button').forEach(button => {
                button.className = 'px-2 py-0.5 rounded text-[#52606D] hover:text-[#0F172A] font-medium';
            });
            activeButton.className = 'px-2 py-0.5 rounded bg-white text-[#0B2A42] font-semibold shadow-xs';
            chartInstance.setOption(buildChartOption(), true);
            if (isTableView) renderTable();
        }

        function toggleView() {
            const chartEl = document.getElementById('chart-main');
            const tableEl = document.getElementById('table-main');
            isTableView = !isTableView;

            if (isTableView) {
                chartEl.classList.add('hidden');
                tableEl.classList.remove('hidden');
                renderTable();
            } else {
                tableEl.classList.add('hidden');
                chartEl.classList.remove('hidden');
                chartInstance.resize();
            }
        }

        function renderTable() {
            const tableEl = document.getElementById('table-main');
            if (!chartConfig.tableDataExtractor) {
                tableEl.innerHTML = '<div class="p-8 text-center text-xs text-slate-400">当前图表暂无结构化表格数据</div>';
                return;
            }
            let data = chartConfig.tableDataExtractor(chartConfig.data, currentGranularity, chartConfig);
            let headers = [...data.headers];
            let rows = [...data.rows];

            if (currentSortCol !== null) {
                rows.sort((a, b) => {
                    let vA = a[currentSortCol];
                    let vB = b[currentSortCol];
                    let nA = parseFloat(String(vA).replace(/[^0-9.-]/g, ''));
                    let nB = parseFloat(String(vB).replace(/[^0-9.-]/g, ''));
                    if (!isNaN(nA) && !isNaN(nB)) {
                        return currentSortAsc ? nA - nB : nB - nA;
                    }
                    return currentSortAsc ? String(vA).localeCompare(String(vB)) : String(vB).localeCompare(String(vA));
                });
            }

            tableEl.innerHTML = `
                <table class="w-full text-xs text-left border-collapse">
                    <thead class="bg-slate-50 text-[#0B2A42] font-bold border-b border-slate-200 sticky top-0 z-10">
                        <tr>
                            ${headers.map((h, idx) => `
                                <th class="px-3 py-2 border-r border-slate-200 last:border-0 cursor-pointer hover:bg-slate-100 whitespace-nowrap select-none" onclick="sortTable(${idx})">
                                    <div class="flex items-center justify-between gap-2">
                                        <span>${h}</span>
                                        <span class="text-[10px] text-slate-400">${currentSortCol === idx ? (currentSortAsc ? '▲' : '▼') : '⇅'}</span>
                                    </div>
                                </th>
                            `).join('')}
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700 font-mono text-[11px]">
                        ${rows.map(row => `
                            <tr class="hover:bg-blue-50/50 transition-colors">
                                ${row.map((cell, cIdx) => `
                                    <td class="px-3 py-2 border-r border-slate-100 last:border-0 whitespace-nowrap cursor-pointer hover:text-[#123B5D] hover:font-bold" onclick="copyCellText('${String(cell).replace(/'/g, "\'")}')" title="点击复制单元格">
                                        ${cell}
                                    </td>
                                `).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function sortTable(colIdx) {
            if (currentSortCol === colIdx) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortCol = colIdx;
                currentSortAsc = true;
            }
            renderTable();
        }

        function copyCellText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast(`已复制: ${text}`));
            }
        }

        function exportCSV() {
            if (!chartConfig.tableDataExtractor) return;
            const data = chartConfig.tableDataExtractor(chartConfig.data, currentGranularity, chartConfig);
            let csv = '\uFEFF' + data.headers.join(',') + '\n';
            data.rows.forEach(r => {
                csv += r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${chartConfig.title || '图表数据'}_明细.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('已开始下载 CSV 数据明细 (带 UTF-8 BOM 防乱码)');
        }

        function copyPNG() {
            if (!chartInstance) return;
            const url = chartInstance.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#FFFFFF' });
            fetch(url).then(res => res.blob()).then(blob => {
                if (navigator.clipboard && navigator.clipboard.write) {
                    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(() => showToast('已成功复制 2x 高清图表图片至剪贴板！'));
                } else {
                    showToast('当前浏览器环境不支持直接写入图片剪贴板');
                }
            });
        }

        function toggleFullscreen() {
            const card = document.getElementById('cardContainer');
            if (!document.fullscreenElement) {
                card.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }


        function renderSharedExplanationDialogContent(explanation = {}) {
            const title = explanation.title || '图表与指标说明';
            const overview = explanation.overview || '该图表呈现业务多维经营分析数据，辅助管理层洞察关键业务特征。';
            const type = explanation.type || '分析图表';
            const period = explanation.period || '报告周期';
            const comparison = explanation.comparison || '按业务统一口径';
            const structure = explanation.structure || {};
            const xAxis = structure.xAxis || { name: '分析维度', meaning: '业务时间或分类维度', range: '标准化范围' };
            const yAxis = structure.yAxis || { name: '指标量纲', meaning: '绝对数值或百分比', range: '自适应区间' };
            const series = Array.isArray(structure.series) ? structure.series : [];
            const metrics = Array.isArray(explanation.metrics) && explanation.metrics.length
                ? explanation.metrics
                : [{ name: title, definition: overview, formula: '标准业务核算公式', rule: '遵循统一业务核算与数据治理口径。' }];

            return `
                <header class="exp-dialog-topbar">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-6 h-6 rounded-md bg-blue-50 text-[#123B5D] flex items-center justify-center flex-shrink-0">
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        </span>
                        <h3 class="text-sm font-bold text-[#0B2A42] truncate">${title}</h3>
                    </div>
                    <button id="closeExplainModalBtn" type="button" class="dialog-close w-7 h-7 rounded-md flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 cursor-pointer transition-colors" aria-label="关闭">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </header>
                <div class="exp-dialog-body custom-scrollbar">
                    <div class="exp-overview-box">
                        <p class="text-xs text-slate-600 leading-relaxed m-0">${overview}</p>
                        <div class="exp-specs-strip">
                            <span class="exp-spec-badge"><strong class="text-slate-400 font-medium mr-1">图表类型:</strong>${type}</span>
                            <span class="exp-spec-badge"><strong class="text-slate-400 font-medium mr-1">统计周期:</strong>${period}</span>
                            <span class="exp-spec-badge"><strong class="text-slate-400 font-medium mr-1">对比基准:</strong>${comparison}</span>
                        </div>
                    </div>
                    <div class="border border-slate-200 rounded-lg p-3 bg-white space-y-2">
                        <div class="text-xs font-bold text-[#123B5D] flex items-center gap-1.5">
                            <svg class="w-4 h-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.9a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
                            <span>坐标系维度与数据序列架构</span>
                        </div>
                        <div class="exp-axis-grid">
                            <div class="exp-axis-cell">
                                <div class="font-bold text-[#0B2A42] mb-1">X 轴 · ${xAxis.name}</div>
                                <div class="text-slate-600 text-[11px]"><span class="text-slate-400 mr-1.5">业务含义:</span>${xAxis.meaning}</div>
                                <div class="text-slate-600 text-[11px]"><span class="text-slate-400 mr-1.5">数据粒度:</span>${xAxis.range || ''}</div>
                            </div>
                            <div class="exp-axis-cell">
                                <div class="font-bold text-[#0B2A42] mb-1">Y 轴 · ${yAxis.name}</div>
                                <div class="text-slate-600 text-[11px]"><span class="text-slate-400 mr-1.5">业务含义:</span>${yAxis.meaning}</div>
                                <div class="text-slate-600 text-[11px]"><span class="text-slate-400 mr-1.5">量纲刻度:</span>${yAxis.range || ''}</div>
                            </div>
                        </div>
                        ${series.length ? `
                            <div class="flex flex-wrap gap-2 pt-1">
                                ${series.map(item => `
                                    <div class="inline-flex items-center gap-1 text-[11px] bg-slate-50 border border-slate-200 px-2 py-0.5 rounded">
                                        <span class="w-1.5 h-1.5 rounded-full bg-[#123B5D]"></span>
                                        <span class="font-semibold text-slate-700">${item.name}</span>
                                        <span class="text-slate-400">(${item.desc || ''})</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    <div class="space-y-2">
                        <div class="text-xs font-bold text-[#123B5D] flex items-center gap-1.5">
                            <svg class="w-4 h-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
                            <span>核心指标业务口径与数学公式</span>
                        </div>
                        <div class="space-y-2">
                            ${metrics.map(metric => `
                                <div class="exp-metric-card space-y-1.5">
                                    <div class="text-xs font-bold text-[#0B2A42]">${metric.name}</div>
                                    <div class="text-xs flex items-baseline gap-2"><span class="text-slate-400 w-16 shrink-0 text-[11px]">业务定义</span><span class="text-slate-700 leading-relaxed">${metric.definition}</span></div>
                                    <div class="text-xs flex items-baseline gap-2"><span class="text-slate-400 w-16 shrink-0 text-[11px]">计算公式</span><span class="text-slate-700"><code class="exp-formula">${metric.formula}</code></span></div>
                                    ${metric.rule ? `<div class="text-xs flex items-baseline gap-2"><span class="text-slate-400 w-16 shrink-0 text-[11px]">判定规则</span><span class="text-slate-600 text-[11.5px] leading-relaxed">${metric.rule}</span></div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }


        function openExplanation() {
            const dialog = document.getElementById('app-explain-dialog');
            dialog.innerHTML = renderSharedExplanationDialogContent(explanationData);
            dialog.querySelector('#closeExplainModalBtn')?.addEventListener('click', () => dialog.close(), { once: true });
            dialog.showModal();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        document.addEventListener('DOMContentLoaded', initChart);
    </script>
</body>
</html>
